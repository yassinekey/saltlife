name: Deploy to Production Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Executing Remote Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /home/saltlife
            git pull origin main
            
            # Example: Run a WordPress CLI command
            wp cache flush --path=/var/www/html/your-project-path
            
            # Example: Run a custom shell or PHP script
            # sh ./scripts/deploy-tasks.sh
            # php ./scripts/post-deploy.php
